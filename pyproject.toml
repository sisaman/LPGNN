[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lpgnn-dgl"
version = "0.1.0"
description = "DGL implementation of Locally Private Graph Neural Networks"
readme = "README.md"
# PyTorch 2.0.1 and DGL 1.1.3 provide wheels through Python 3.11.
requires-python = ">=3.9,<3.12"
dependencies = [
    "dgl==1.1.3+cu118",
    # DGL dynamically links cuSPARSE, which the PyTorch cu118 wheel omits.
    "nvidia-cusparse-cu11==11.7.5.86",
    # PyTorch 2.0.1's NumPy integration requires NumPy 1.x.
    "numpy>=1.23.5,<2",
    # results.ipynb uses DataFrame.append and Series.iteritems.
    "pandas>=1.5.3,<2",
    "scipy>=1.10,<2",
    "seaborn>=0.13.2,<0.14",
    "tabulate>=0.9,<1",
    "torch==2.0.1+cu118",
    "tqdm>=4.65,<5",
    "wandb>=0.18,<1",
]

[dependency-groups]
notebook = ["ipykernel>=6.29,<7", "jupyterlab>=4,<5"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.hatch.build.targets.wheel]
packages = ["src/lpgnn_dgl"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
dgl = { index = "dgl-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "dgl-cu118"
url = "https://data.dgl.ai/wheels/cu118/repo.html"
format = "flat"
explicit = true

[tool.ruff.lint]
# argparse metadata annotations are written as dict(help=...) calls
extend-ignore = ["C408"]
